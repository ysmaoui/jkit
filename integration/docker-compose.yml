services:
  jenkins:
    build:
      context: ./jenkins
    ports:
      - "${JENKINS_PORT:-9090}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/login"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false

services:
  jenkins:
    build:
      context: ./jenkins
      args:
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        HTTP_PROXY: ${HTTP_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        https_proxy: ${https_proxy:-}
        http_proxy: ${http_proxy:-}
        no_proxy: ${no_proxy:-}
    ports:
      - "${JENKINS_PORT:-9090}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/login"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
